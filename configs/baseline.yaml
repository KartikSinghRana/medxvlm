# Phase 3 real training run: baseline classifier (no contrastive pretraining, no text branch).
manifest: data/processed/manifest.csv
output_dir: checkpoints/baseline
log_dir: runs/baseline

seed: 0
epochs: 5
batch_size: 16
num_workers: 4
lr: 0.0001
weight_decay: 0.01

loss: bce  # bce | asl -- the second (optional) ablation swaps this to "asl"
pretrained: true
