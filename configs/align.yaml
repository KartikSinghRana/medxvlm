# Phase 3 real training run: Stage 1 contrastive alignment.
# use_local_loss is the ablation study's on/off switch -- run this config
# twice (--use-local-loss / --no-local-loss on the CLI) with everything
# else held fixed.
manifest: data/processed/manifest.csv
output_dir: checkpoints/align
log_dir: runs/align

seed: 0
epochs: 5
batch_size: 16
num_workers: 4
lr: 0.00002
weight_decay: 0.01
max_text_length: 256

use_local_loss: true
pretrained: true
