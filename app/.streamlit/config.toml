# MedXVLM demo theme — script-level config (applies to `streamlit run app/app.py`
# from any working directory). Light only: neutral zinc greys, near-black for
# interactive states, and a single deep-teal accent reserved for data.

[server]
enableStaticServing = true      # serves app/static/ (the logo)
maxUploadSize = 10              # MB; chest X-ray PNG/JPGs are well under this (public hosting)

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#18181b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f5"
textColor = "#18181b"
linkColor = "#0f766e"
borderColor = "#e4e4e7"
codeBackgroundColor = "#f4f4f5"
codeTextColor = "#3f3f46"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
linkUnderline = false

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.8rem"
headingFontSizes = ["28px", "18px", "15px", "14px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]

dataframeBorderColor = "#e4e4e7"
dataframeHeaderBackgroundColor = "#fafafa"

greenColor = "#15803d"
redColor = "#b91c1c"
orangeColor = "#c2410c"
yellowColor = "#a16207"
blueColor = "#1d4ed8"
violetColor = "#6d28d9"
grayColor = "#71717a"
chartCategoricalColors = ["#0f766e", "#18181b", "#a1a1aa", "#0e7490", "#52525b", "#d4d4d8"]

[theme.sidebar]
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#f4f4f5"
borderColor = "#e4e4e7"
